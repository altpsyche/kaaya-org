heroHeading: Place
heroSubheading: Mud architecture, a rural setting, embedded in nature
locationParagraphs:
  - >-
    Kaaya sits in Tilwari, a village in Sahaspur Block of Dehradun district, at
    the feet of Bhadraj Valley folded into the foothills of the Mussoorie
    range. It's a landscape of contrasts: steep, forested slopes rising toward
    the Bhadraj temple at over 8,000 feet giving way to terraced fields and
    modest homesteads below, with nearly two-thirds of the watershed under
    reserve forest cover. All nine villages of the cluster sit on the main
    road network, and the upcoming Delhi–Dehradun Expressway is expected to
    bring the region within roughly 2.5 hours of Delhi.
  - >-
    Kaaya's own campus spans about an acre on the edge of that reserve forest,
    with a perennial stream running alongside it. The campus is embedded in
    nature and reflects a deliberate commitment to sustainable architecture
    and community integration. The campus is organised into three
    interconnected sections: a cafeteria and shop offering locally sourced
    goods, a gallery and eight independent eco-cottages built with mud,
    bamboo, stone, and wood — a working example of sustainable, traditional
    construction rather than a stylistic gesture.
  - >-
    Beyond these, the campus houses specialised spaces for creative and
    learning work: art and pottery studios, a wood workshop, an amphitheatre,
    and a small nursery, all built using traditional techniques adapted to
    modern educational use.
locationQuote:
  quote: >-
    Set amid lush green and earthen tones, the campus functions as much as a
    peaceful eco-retreat setting as a working centre. As we say, here, the
    space itself is a facilitator
neighbourhoods:
  - title: Kitchen Gardens — Neighbours as organic growers
    body: >-
      Tilwari village sits in the Doon Valley, a landscape under real pressure.
      Around 65% of

      households in the area are classified as Below Poverty Line or Antyodaya. Farming has become

      increasingly unviable. Young people leave.


      We believe bridging the urban-rural gap can tap into energy, creativity, and possibility on both

      sides. Kaaya does not pretend to have solved these problems — but we are trying, carefully and

      incrementally, to show a different way of being in this place.
  - title: Farmer's Market — An upcoming initiative at Kaaya
    quote: A household walks to the town market, buys tomatoes, dal, dairy, a packet
      of seeds — and the cash that could have stayed in the neighbourhood
      disappears into a distant supply chain
