heroImage: /uploads/gallery-hero-mountains.png
heroHeading: Art from the Himalayas
heroSubheading: >-
  We celebrate the vibrant spirit of the emerging Artists from Himalayan region
  through curated exhibits and collectibles.
introParagraphs:
  - >-
    Kaaya gallery exists to bring original art and its appreciators into direct
    exchange - so that values, once it moves, stays close to the place and
    people it came from.
  - >-
    The idea has evolved out of the Padav Fellowship Program, where each year 20
    promising artists are awarded fellowships by the Bangani Art Foundation at
    the Kaaya Learning Centre. These artists are shortlisted from the Himalayan
    states by a jury and receive mentorship from eminent artists.
finalQuote:
  quote: >-
    Generally, ordinary people spend a lot on making their home. Kaaya gallery
    connects that spend to original art - a living memory- and the artists
    behind it.
