heroHeading: It's about Re-imagining
heroSubheading: Tilwari, Dehradun · Himalayan Foothills, India
introHeading: An art space on a working campus
introText: >-
  Kaaya Learning Centre is a mud-built campus in the village of Tilwari where
  urban and rural communities meet, learn from each other, and find that the
  exchange is worth making.


  Kaaya exists to see if it is possible that rural landscapes can become places of learning, living and innovation—not by replacing tradition, but by building upon it.
directionsNote: We are approximately 20 km from Dehradun city
