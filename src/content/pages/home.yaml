heroHeading: It's about Re-imagining
heroSubheading: Tilwari, Dehradun · Himalayan Foothills, India
introHeading: A small experiment in sustainable living
introText: Kaaya Learning Centre is a mud-built campus in the village of Tilwari
  where urban and rural communities meet, learn from each other, and find that
  the exchange is worth making.
navCards:
  - title: Place
    description: Looking at how we can belong to a place; Where we are, and what the
      place is still asking
    href: /place
  - title: Learn
    description: Re-imagining how knowledge is acquired; designing programs for
      those who want to learn alongside
    href: /learn
  - title: Incubate
    description: Re-imagining how ideas grow; recognizing that they also need space
      to take root & a place to evolve
    href: /incubate
  - title: Exchange
    description: Re-imagining how value circulates; how we sustain ourselves and
