backend:
  name: git-gateway
  repo: altpsyche/kaaya-org
  branch: main
  identity_url: https://auth.decapbridge.com/sites/ef6904eb-77c4-48c8-b441-d782f91deb1d
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://kaaya.org

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # One build serves six hostnames. The file names below carry the section
  # prefix that the page route sits under — `community-learn.yaml` renders at
  # community.kaaya.org/learn, and so on.
  - name: pages
    label: Pages
    files:
      # ---- kaaya.org ----
      - label: Home
        name: home
        file: src/content/pages/home.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - {label: "Intro Heading", name: "introHeading", widget: "string", required: false}
          - {label: "Intro Text", name: "introText", widget: "text", required: false}
          - {label: "Directions Note", name: "directionsNote", widget: "string", required: false}
          - label: "Kaaya Story Teaser"
            name: "storyParagraphs"
            widget: "list"
            required: false
          - label: "Kaaya Story Links"
            name: "storyLinks"
            widget: "list"
            required: false
            fields:
              - {label: "Prompt", name: "prompt", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Path", name: "href", widget: "string", hint: "Route path such as /place — rendered through link()"}

      # ---- gallery.kaaya.org ----
      - label: Gallery — Home
        name: gallery
        file: src/content/pages/gallery.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Mission and Origin"
            name: "introParagraphs"
            widget: "list"
            required: false
          - label: "Pull Quote"
            name: "finalQuote"
            widget: "object"
            required: false
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false

      # ---- place.kaaya.org ----
      - label: Place — Home
        name: place
        file: src/content/pages/place.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Location Paragraphs"
            name: "locationParagraphs"
            widget: "list"
            required: false
          - label: "Location Quote"
            name: "locationQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
          - label: "Neighbourhoods"
            name: "neighbourhoods"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text", required: false}
              - {label: "Quote", name: "quote", widget: "text", required: false}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
              - {label: "Link Label", name: "linkLabel", widget: "string", required: false}
              - {label: "Link URL", name: "linkHref", widget: "string", required: false}

      - label: Place — Story
        name: place-story
        file: src/content/pages/place-story.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Section 1 Paragraphs"
            name: "section1Paragraphs"
            widget: "list"
            required: false
          - label: "Section 2 Paragraphs"
            name: "section2Paragraphs"
            widget: "list"
            required: false
          - label: "Section 2 Quote"
            name: "section2Quote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
          - label: "Principles"
            name: "principles"
            widget: "list"
            required: false
            fields:
              - {label: "Number", name: "number", widget: "number", value_type: "int"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}

      # Canonical source for pottery / workshop / trails / nature art / farm
      # picnics. Do not re-describe these on Learn — link to this page instead.
      - label: Place — Activities
        name: place-activities
        file: src/content/pages/place-activities.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false
          - label: "Activities"
            name: "activities"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Duration / Capacity", name: "detail", widget: "string", required: false}

      - label: Place — Stay
        name: place-stay
        file: src/content/pages/place-stay.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Accommodation"
            name: "accommodation"
            widget: "list"
            required: false
            fields:
              - {label: "Type", name: "type", widget: "string"}
              - {label: "Details", name: "details", widget: "string"}
              - {label: "Capacity", name: "capacity", widget: "string"}
          - {label: "Stay Note", name: "stayNote", widget: "text", required: false}
          - {label: "Price Range", name: "priceRange", widget: "string", required: false}
          - {label: "Price Note", name: "priceNote", widget: "string", required: false}
          - label: "Meal Plans"
            name: "mealPlans"
            widget: "list"
            required: false
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Campus Facilities"
            name: "facilities"
            widget: "list"
            required: false

      - label: Place — Booking
        name: place-booking
        file: src/content/pages/place-booking.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false
          - {label: "Booking Note", name: "bookingNote", widget: "text", required: false}

      # ---- community.kaaya.org ----
      - label: Community — Home
        name: community
        file: src/content/pages/community.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false
          - label: "Sections"
            name: "sections"
            widget: "list"
            required: false
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
              - {label: "URL", name: "href", widget: "string"}
          - label: "Sunday Market Paragraphs"
            name: "marketParagraphs"
            widget: "list"
            required: false
          - label: "Sunday Market Quote"
            name: "marketQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}

      - label: Community — Learn
        name: community-learn
        file: src/content/pages/community-learn.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false
          - label: "Programs"
            name: "programs"
            widget: "list"
            required: false
            fields:
              - {label: "Duration", name: "duration", widget: "string"}
              - {label: "Programme Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
          - label: "Programs Quote"
            name: "programsQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}

      - label: Community — Incubate
        name: community-incubate
        file: src/content/pages/community-incubate.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Intro Paragraphs"
            name: "introParagraphs"
            widget: "list"
            required: false
          - {label: "Stat 1 — Value", name: "stat1Value", widget: "string", required: false}
          - {label: "Stat 1 — Label", name: "stat1Label", widget: "string", required: false}
          - {label: "Stat 2 — Value", name: "stat2Value", widget: "string", required: false}
          - {label: "Stat 2 — Label", name: "stat2Label", widget: "string", required: false}
          - label: "Incubations"
            name: "incubations"
            widget: "list"
            required: false
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Incubated By", name: "by", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "href", widget: "string"}
          - label: "Incubations Quote"
            name: "incubationsQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}

      - label: Community — Exchange
        name: community-exchange
        file: src/content/pages/community-exchange.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - label: "Exchange Table — Headers"
            name: "exchangeHeaders"
            widget: "list"
            required: false
          - label: "Exchange Table — Rows"
            name: "exchangeRows"
            widget: "list"
            required: false
            fields:
              - {label: "Visitor's Action", name: "visitorAction", widget: "string"}
              - {label: "Kaaya's Gain", name: "kaayaGain", widget: "string"}
              - {label: "Community Benefit", name: "communityBenefit", widget: "text"}
          - label: "Sunday Market Paragraphs"
            name: "marketParagraphs"
            widget: "list"
            required: false
          - label: "Sunday Market Quote"
            name: "marketQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}
          - label: "Institution Table — Headers"
            name: "institutionHeaders"
            widget: "list"
            required: false
          - label: "Institution Table — Rows"
            name: "institutionRows"
            widget: "list"
            required: false
            fields:
              - {label: "Institutional Engagement", name: "engagement", widget: "text"}
              - {label: "Kaaya's Role", name: "kaayaRole", widget: "text"}
              - {label: "Community Benefit", name: "communityBenefit", widget: "text"}
          - label: "Pillars"
            name: "pillars"
            widget: "list"
            required: false
            fields:
              - {label: "Number", name: "number", widget: "number", value_type: "int"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Body", name: "body", widget: "text"}
          - label: "Partners"
            name: "partners"
            widget: "list"
            required: false
          - label: "Final Quote"
            name: "finalQuote"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Attribution", name: "attribution", widget: "string", required: false}

      # ---- events.kaaya.org ----
      # The listing itself comes from the `events` folder collection added in
      # T8.4. These fields are the page chrome and the empty state.
      - label: Events — Home
        name: events
        file: src/content/pages/events.yaml
        format: yaml
        fields:
          - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
          - {label: "Hero Heading", name: "heroHeading", widget: "string", required: false}
          - {label: "Hero Subheading", name: "heroSubheading", widget: "string", required: false}
          - {label: "Empty State — Heading", name: "emptyStateHeading", widget: "string", required: false}
          - {label: "Empty State — Body", name: "emptyStateBody", widget: "text", required: false}

  # Blog posts — Markdown with YAML frontmatter. Served at
  # happenings.kaaya.org/blog/*.
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    delete: false
    extension: md
    format: frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Published Date", name: "pubDate", widget: "datetime"}
      - {label: "Description", name: "description", widget: "text"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Read Time", name: "readTime", widget: "string", required: false}
      - {label: "Categories", name: "categories", widget: "list", required: false}
      - {label: "Body", name: "body", widget: "markdown"}

  # Gallery collections (TDD §12). `price` is a display string: there is no
  # cart, no checkout and nothing that adds one price to another (decision 2).
  - name: works
    label: Works
    folder: src/content/works
    create: true
    delete: true
    extension: md
    format: frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      # A relation rather than free text, so a work can never name an artist
      # slug that no profile answers to.
      - {label: "Artist", name: "artist", widget: "relation", collection: "artists", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"], required: false}
      - {label: "Category", name: "category", widget: "select", options: ["artworks", "handmade", "collectibles"]}
      - {label: "Medium", name: "medium", widget: "string", required: false}
      - {label: "Size", name: "size", widget: "string", required: false}
      - {label: "Price", name: "price", widget: "string", required: false, hint: "Display only — shown as written, never totalled. Buying is by enquiry."}
      - {label: "Available", name: "available", widget: "boolean", default: true, required: false}
      - {label: "Made on site", name: "madeOnSite", widget: "boolean", default: false, required: false, hint: "Made in Kaaya's own Pottery or Workshop."}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Images", name: "images", widget: "list", field: {label: "Image", name: "image", widget: "image"}, required: false}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}

  - name: artists
    label: Artists
    folder: src/content/artists
    create: true
    delete: true
    extension: md
    format: frontmatter
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Tagline", name: "tagline", widget: "string", required: false}
      - {label: "Portrait", name: "portrait", widget: "image", required: false}
      - {label: "Origin", name: "origin", widget: "string", required: false}
      - {label: "Studios residency", name: "residency", widget: "boolean", default: false, required: false, hint: "Lives and works on the campus."}
      - {label: "Artist of the Month", name: "featuredMonth", widget: "string", required: false, hint: "Set on one artist only. Selects the slot; the value is not shown."}
      # Defaults to false in the schema, so a profile saved without ticking this
      # is built but never listed and has no page.
      - {label: "Published", name: "published", widget: "boolean", default: true}
      - {label: "Biography", name: "body", widget: "markdown", required: false}

  # Every event lives here once (decision 18). `section` and `type` are selects
  # rather than free text: `section` decides which section home features the
  # event, `type` is the filter a visitor sees, and a typo in either would drop
  # the event out of both silently.
  - name: events
    label: Events
    folder: src/content/events
    create: true
    delete: true
    extension: md
    format: frontmatter
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Section", name: "section", widget: "select", options: ["gallery", "community"], hint: "Which section home features it. Never shown on events.kaaya.org."}
      - {label: "Type", name: "type", widget: "select", options: ["exhibition", "workshop", "talk", "market", "other"]}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false, hint: "Pins it to the top of the events page."}
      - {label: "Start Date", name: "startDate", widget: "datetime"}
      # Uncheck while the date is a placeholder: the pages then print "Date to
      # be announced" rather than a date nobody can turn up on (T8.3).
      - {label: "Date is confirmed", name: "dateConfirmed", widget: "boolean", default: true, required: false}
      - {label: "End Date", name: "endDate", widget: "datetime", required: false}
      - {label: "Venue", name: "venue", widget: "string"}
      - {label: "Hero Image", name: "heroImage", widget: "image", required: false}
      - {label: "RSVP Note", name: "rsvpNote", widget: "text", required: false, hint: "Contact only — there is no ticketing and no registration."}
      - {label: "Body", name: "body", widget: "markdown", required: false}
